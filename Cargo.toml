[package]
name = "irchub"
version = "2.4.5"
edition = "2024"
rust-version = "1.89"
description = "Encrypted hub mesh for ircbot (safe-Rust port of irchub.c)"
license = "MIT"
publish = false

[lib]
name = "irchub"
path = "src/lib.rs"

[[bin]]
name = "irchub"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[dependencies]
# Cryptography (RustCrypto + dalek), matched to ircbot.rs so the two trees
# agree bit for bit on the wire: AES-256-GCM, PBKDF2/HKDF-SHA256, Ed25519
# signatures and X25519 key agreement.
aes-gcm = "0.11"
ed25519-dalek = "3.0"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
hkdf = "0.13"
pbkdf2 = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1.9"
base64 = "0.23"
# keygen only: passphrase-protected keys (docs/console.md §9) -- scrypt for
# the irckey-v2 IRC key, bcrypt_pbkdf + AES-256-CTR for the OpenSSH key.
# All pure Rust.  src/bin/keygen.rs is byte-identical to ircbot.rs's.
scrypt = { version = "0.12", default-features = false }
bcrypt-pbkdf = "0.11"
aes = "0.9"
ctr = "0.10"

# Networking: the poll(2) loop lives in nix; socket2 gives the listener and
# the outbound peer connects with their timeouts.
socket2 = "0.6"

# HTTPS for the hub's own self-update (src/update.rs), matched to ircbot.rs so
# both trees fetch a release the same way: rustls with the graviola provider
# and webpki roots, no OpenSSL and no cc(1) at build time.  graviola is
# x86_64/aarch64 only and asserts on its required CPU features, so the
# provider is installed lazily and a failure disables the updater rather than
# taking the daemon down (see update::tls_ready).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

# OS integration through safe wrappers (poll, daemon, mlock, termios,
# RLIMIT_CORE, PR_SET_DUMPABLE).
nix = { version = "0.31", features = ["user", "fs", "process", "term", "resource", "feature", "poll", "socket"] }
region = "4"
# The console log ring: an anonymous mapping, mlock'd and MADV_DONTDUMP
# through memmap2's safe advise/lock (unsafe_code is forbidden here).
memmap2 = "0.9"

# The SSH admin console (src/console/, docs/console.md): the hub's only admin
# interface.  russh 0.63 needs a crypto backend; `ring` is the lighter one
# (aws-lc-rs builds a large C library).  ring compiles a little C/asm, which
# is why .cargo/config.toml names a C compiler for the musl target.  Pinned
# exactly: this code runs before authentication.  russh runs on its own
# single-threaded tokio runtime on the console thread.
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros", "io-util"] }
signal-hook = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Forgetting a Zeroizing/Locked value skips its wipe.
mem_forget = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: secret wiping is Drop-based (Zeroizing, Locked's mlock
# guard) and panic = "abort" runs no destructors.  Core dumps are already
# off via RLIMIT_CORE 0 + set_dumpable(false) in harden_process().
panic = "unwind"
# Drops DWARF but keeps the symbol table, so a field backtrace stays readable.
strip = "debuginfo"
# A wraparound on hostile input becomes a controlled panic, not a bad index.
overflow-checks = true
